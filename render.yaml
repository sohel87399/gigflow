services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: smartleads-backend
    runtime: docker
    dockerfilePath: ./smart-leads-dashboard/backend/Dockerfile
    dockerContext: ./smart-leads-dashboard/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://239x1a3365_db_user:PMRbyKrsghTeDyxS@cluster0.onkwujn.mongodb.net/smartleads?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: smartleads-frontend
    runtime: docker
    dockerfilePath: ./smart-leads-dashboard/frontend/Dockerfile
    dockerContext: ./smart-leads-dashboard/frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
